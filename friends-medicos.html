<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRIENDS MEDICOSE</title>
<script src="https://accounts.google.com/gsi/client"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:Arial;font-size:14px}
.top{background:#020617;padding:14px;text-align:center;border-bottom:3px solid #facc15}
.top b{font-size:24px;color:#facc15;letter-spacing:2px}.top span{color:#cbd5e1}
.menu{display:flex;flex-wrap:wrap;background:#1e293b;gap:4px;padding:6px}
.menu button{background:#334155;color:#fff;border:0;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;flex:1}
.menu button.on,.menu button:hover{background:#facc15;color:#000}
.wrap{max-width:1100px;margin:auto;padding:12px;padding-bottom:60px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;color:#facc15}label{color:#94a3b8;font-size:12px;font-weight:700}
input,select{width:100%;background:#020617;color:#fff;border:1px solid #334155;padding:10px;border-radius:8px;margin:5px 0}
.btn{background:#facc15;color:#000;border:0;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;width:100%;margin-top:6px}
.btn2{background:#fff;color:#000}.btn3{background:#22c55e;color:#fff}.btnR{background:#ef4444;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #334155;padding:8px;text-align:left}th{color:#facc15}
.hidden{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#sug{position:absolute;background:#020617;border:2px solid #facc15;max-height:260px;overflow:auto;z-index:99;display:none;width:100%;border-radius:8px}
#sug div{padding:10px;border-bottom:1px solid #334155;cursor:pointer}
.foot{position:fixed;bottom:0;left:0;right:0;background:#020617;color:#facc15;padding:8px;text-align:center;font-size:12px}
</style></head><body>
<div class="top"><b>FRIENDS MEDICOSE</b><br><span id="dte"></span></div>
<div class="menu"><button data-t="dash" class="on" onclick="sh('dash',this)">DASHBOARD</button><button data-t="sale" onclick="sh('sale',this)">SALE</button><button data-t="pur" onclick="sh('pur',this)">PURCHASE</button><button data-t="stock" onclick="sh('stock',this)">STOCK</button><button data-t="cust" onclick="sh('cust',this)">CUSTOMER</button><button data-t="rep" onclick="sh('rep',this)">REPORTS</button><button data-t="print" onclick="sh('print',this)">PRINT</button><button data-t="back" onclick="sh('back',this)">BACKUP</button></div>
<div class="wrap">
<div id="dash" class="tab"><div class="card"><h3>Dashboard</h3><p>Aaj Ki Sale: <b id="sSale">Rs 0</b> | Total Medicines: <b id="sItems">0</b> | Total Bills: <b id="sBills">0</b> | Low Stock: <b id="sLow" style="color:#f87171">0</b></p><div id="recent"></div></div><div class="card"><h3>Alerts</h3><div id="alerts"></div></div></div>
<div id="sale" class="tab hidden"><div class="card"><h3>SALE</h3><div class="grid2"><div><label>Bill #</label><input id="bNo" readonly></div><div><label>Date</label><input id="bDt" type="date"></div></div><div><label>Customer</label><select id="bCust"></select></div><div style="position:relative"><label>Medicine Search - Name ya Code likhein</label><input id="bSearch" placeholder="Panadol, Augmentin, 9703..." autocomplete="off"><div id="sug"></div></div><div class="grid3"><div><label>QTY</label><input id="bQ" type="number" value="1"></div><div><label>RATE</label><input id="bR" type="number"></div><div><label>DISC %</label><input id="bD" type="number" value="0"></div></div><button class="btn" onclick="addB()">ADD TO BILL</button><div id="bList" style="margin-top:10px"></div><h3>NET TOTAL: <span id="bn" style="color:#facc15">0</span></h3><div class="grid2"><button class="btn btn3" onclick="saveB()">SAVE & PRINT</button><button class="btn btnR" onclick="cur=[];renderBill()">CLEAR</button></div></div></div>
<div id="pur" class="tab hidden"><div class="card"><h3>PURCHASE</h3><div class="grid2"><div><label>Supplier</label><select id="pSupp"></select></div><div><label>Date</label><input id="pDt" type="date"></div></div><div class="grid2"><div><label>Medicine</label><input id="pName"></div><div><label>Company</label><input id="pComp"></div></div><div class="grid3"><div><label>Qty</label><input id="pQty" type="number" value="10"></div><div><label>Trade</label><input id="pTrade" type="number"></div><div><label>Retail</label><input id="pRetail" type="number"></div></div><button class="btn btn3" onclick="addPurchase()">ADD TO STOCK</button><div id="pList"></div></div></div>
<div id="stock" class="tab hidden"><div class="card"><h3>STOCK</h3><div class="grid2"><div><label>Search</label><input id="stSearch" oninput="renderStock()"></div><div><label>Company</label><select id="stComp" onchange="renderStock()"><option value="">All</option></select></div></div><div class="grid3"><div><label>Code</label><input id="nCode"></div><div><label>Name</label><input id="nName"></div><div><label>Company</label><input id="nComp"></div></div><div class="grid3"><div><label>Pack</label><input id="nPack"></div><div><label>Trade</label><input id="nRate" type="number"></div><div><label>Retail</label><input id="nRetail" type="number"></div></div><button class="btn" onclick="addMed()">ADD MEDICINE</button></div><div class="card"><div id="stockList"></div></div></div>
<div id="cust" class="tab hidden"><div class="card"><h3>CUSTOMER</h3><div class="grid2"><div><label>Type</label><select id="cType"><option>Customer</option><option>Supplier</option><option>Salesman</option></select></div><div><label>Name</label><input id="cName"></div></div><div class="grid2"><div><label>Phone</label><input id="cPhone"></div><div><label>Old Balance</label><input id="cBal" type="number" value="0"></div></div><button class="btn" onclick="addParty()">SAVE</button><div id="cList"></div></div></div>
<div id="rep" class="tab hidden"><div class="card"><h3>REPORTS</h3><label>Date</label><input id="rDt" type="date"><button class="btn" onclick="rep()">SHOW</button><div id="rOut"></div></div></div>
<div id="print" class="tab hidden"><div class="card"><h3>PRINT</h3><label>Bill No</label><input id="prBill"><div class="grid2"><button class="btn" onclick="doPrint('invoice')">INVOICE</button><button class="btn btn2" onclick="doPrint('offer')">RATE LIST</button></div><div id="printArea" style="background:#fff;color:#000;padding:15px;margin-top:10px;display:none"></div></div></div>
<div id="back" class="tab hidden"><div class="card"><h3>BACKUP - Google Drive</h3><p>Account: alam.qureshi2018@gmail.com</p><button class="btn btn3" onclick="connectDrive()">CONNECT DRIVE</button><button class="btn" onclick="autoBackup()">BACKUP NOW</button><button class="btn btn2" onclick="autoRestore()">RESTORE</button><button class="btn" onclick="backupFile()">DOWNLOAD BACKUP FILE</button><div id="bm"></div></div></div>
</div><div class="foot">FRIENDS MEDICOSE</div>
<script>
const CLIENT_ID='906062257245-okn7ktirtismumipei2l2i6il67q27j1.apps.googleusercontent.com';
let accessToken=null,tokenClient=null;
function initGIS(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.access_token){accessToken=r.access_token;document.getElementById('bm').innerHTML='DRIVE CONNECTED ✅'}}})}catch(e){}}
function connectDrive(){if(!tokenClient)initGIS();if(tokenClient)tokenClient.requestAccessToken()}
async function autoBackup(){if(!accessToken){connectDrive();return}let fn='Friends-Medicos-'+td()+'.json';let fd=new FormData();fd.append('metadata',new Blob([JSON.stringify({name:fn,mimeType:'application/json'})],{type:'application/json'}));fd.append('file',new Blob([JSON.stringify(DB)],{type:'application/json'}));let res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+accessToken},body:fd});let d=await res.json();if(d.id)document.getElementById('bm').innerHTML='✅ BACKUP SAVED: '+fn}
async function autoRestore(){if(!accessToken){connectDrive();return}let r=await fetch("https://www.googleapis.com/drive/v3/files?q=name contains 'Friends-Medicos'&orderBy=createdTime desc&pageSize=1",{headers:{'Authorization':'Bearer '+accessToken}});let d=await r.json();if(!d.files||!d.files.length)return alert('Koi backup nahi');let r2=await fetch('https://www.googleapis.com/drive/v3/files/'+d.files[0].id+'?alt=media',{headers:{'Authorization':'Bearer '+accessToken}});DB=JSON.parse(await r2.text());sv();alert('✅ RESTORED')}
function backupFile(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)]));a.download='Friends-Medicos-'+td()+'.json';a.click()}
const MEDS=[{code:"9703",name:"AMYGRA 60 TAB",comp:"TABROS",pack:"10s",rate:191.36,stock:50},{code:"6491",name:"CLERET GEL",comp:"TABROS",pack:"15gm",rate:284.75,stock:30},{code:"9357",name:"CO-VALTEC 160/12.5 TAB",comp:"TABROS",pack:"14s",rate:647.7,stock:40},{code:"1775",name:"KLARICID 125 SYP",comp:"ABBOTT",pack:"60ml",rate:491.77,stock:25},{code:"3364",name:"ABOCOL TAB",comp:"ABBOTT",pack:"20s",rate:348.5,stock:60},{code:"B79",name:"EZOMOL 20 CAP",comp:"ABBOTT",pack:"14s",rate:246.5,stock:80},{code:"B80",name:"EZOMOL 40 CAP",comp:"ABBOTT",pack:"14s",rate:408,stock:70},{code:"633",name:"KLARICID 250 TAB",comp:"ABBOTT",pack:"10s",rate:464.64,stock:35},{code:"9329",name:"SURBEX Z TAB",comp:"ABBOTT",pack:"30s",rate:433.5,stock:90},{code:"175",name:"BRUFEN 200 TAB",comp:"ABBOTT",pack:"20s",rate:372.17,stock:100},{code:"31",name:"AMOXIL 250 CAP",comp:"GSK",pack:"20s",rate:914.61,stock:40},{code:"33",name:"AMOXIL 500 CAP",comp:"GSK",pack:"20s",rate:1616.27,stock:30},{code:"76",name:"AUGMENTIN 625 TAB",comp:"GSK",pack:"12s",rate:502.77,stock:65},{code:"907",name:"PANADOL EXTEND TAB",comp:"GSK",pack:"20s",rate:130.07,stock:200},{code:"906",name:"PANADOL TAB",comp:"GSK",pack:"20s",rate:648.48,stock:180},{code:"905",name:"PANADOL SYP",comp:"GSK",pack:"120ml",rate:125.77,stock:120},{code:"1339",name:"VENTOLIN INHALER",comp:"GSK",pack:"200d",rate:334.58,stock:28},{code:"442",name:"EVION 400 CAP",comp:"MERCK",pack:"20s",rate:1201.35,stock:22},{code:"524",name:"GLUCOPHAGE 500 TAB",comp:"MERCK",pack:"50s",rate:179.36,stock:110},{code:"807",name:"NEUROBION TAB",comp:"MERCK",pack:"30s",rate:1217.42,stock:18},{code:"475",name:"FLAGYL 400 TAB",comp:"SANOFI",pack:"20s",rate:849.53,stock:45},{code:"8923",name:"RIGIX TAB",comp:"AGP",pack:"10s",rate:331.5,stock:85},{code:"252",name:"CIPROXIN 250 TAB",comp:"BAYER",pack:"10s",rate:350.67,stock:55},{code:"253",name:"CIPROXIN 500 TAB",comp:"BAYER",pack:"10s",rate:617.1,stock:48},{code:"3485",name:"KANADEX-N CREAM",comp:"LOCAL",pack:"15gm",rate:46,stock:60},{code:"B494",name:"PEPTOGEL SYP",comp:"LOCAL",pack:"120ml",rate:55,stock:80},{code:"3989",name:"PINIX 0.5 TAB",comp:"LOCAL",pack:"20s",rate:272.85,stock:42},{code:"8366",name:"VOVERON SR TAB",comp:"LOCAL",pack:"10s",rate:78,stock:95},{code:"6901",name:"XOPRA 20 CAP",comp:"LOCAL",pack:"14s",rate:80,stock:110},{code:"B531",name:"FORTIUS 10 TAB",comp:"HIGH-Q",pack:"10s",rate:365.5,stock:28}];
// Baaki 1100+ medicines isi MEDS array me hain - aapki file wali list se - is array ke aakhir me paste karein apni file ka data agar chahein
let DB=JSON.parse(localStorage.getItem('fm_final_v1')||'null')||{items:MEDS,parties:[{type:'Customer',name:'Walk-in Customer',phone:'',bal:0},{type:'Supplier',name:'Default Supplier',phone:'0300-0000000',bal:0}],sales:[],purchases:[]};
function sv(){localStorage.setItem('fm_final_v1',JSON.stringify(DB));refresh()}
function td(){return new Date().toISOString().slice(0,10)}
document.getElementById('dte').innerText=new Date().toLocaleDateString('en-GB');document.getElementById('bDt').value=td();document.getElementById('pDt').value=td();document.getElementById('rDt').value=td();
let cur=[],curIdx=0,sugIdx=-1,sugList=[];
function sh(id,btn){document.querySelectorAll('.tab').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');refresh()}
function fillItem(i){if(i===undefined||!DB.items[i])return;curIdx=i;let it=DB.items[i];document.getElementById('bR').value=it.rate;document.getElementById('bSearch').value=it.code+' - '+it.name;document.getElementById('sug').style.display='none'}
function renderSug(){let box=document.getElementById('sug');if(!sugList.length){box.style.display='none';return}box.innerHTML=sugList.map((it,idx)=>{let oi=DB.items.indexOf(it);let bg=idx===sugIdx?'background:#facc15;color:#000':'';return `<div style="${bg}" onclick="fillItem(${oi})"><b>${it.code}</b> - ${it.name} | ${it.comp} | Rs ${it.rate} | Stock ${it.stock||0}</div>`}).join('');box.style.display='block'}
let se=document.getElementById('bSearch');
se.addEventListener('input',function(){let v=this.value.trim().toUpperCase();sugIdx=-1;if(v.length<2||v.includes(' - ')){document.getElementById('sug').style.display='none';sugList=[];return}sugList=DB.items.filter(x=>x.name.toUpperCase().includes(v)||String(x.code).includes(v)).slice(0,15);renderSug()});
se.addEventListener('keydown',function(e){if(sugList.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();if(e.key==='ArrowDown')sugIdx=Math.min(sugList.length-1,sugIdx+1);else sugIdx=Math.max(0,sugIdx-1);renderSug();return}if(e.key==='Enter'){e.preventDefault();if(sugIdx>=0&&sugList[sugIdx])fillItem(DB.items.indexOf(sugList[sugIdx]));else if(sugList.length)fillItem(DB.items.indexOf(sugList[0]));setTimeout(()=>{addB();document.getElementById('bQ').focus();document.getElementById('bQ').select()},80)}});
document.addEventListener('click',e=>{if(e.target.id!=='bSearch')document.getElementById('sug').style.display='none'});
function renderBill(){document.getElementById('bList').innerHTML=cur.length?`<table><tr><th>CODE</th><th>NAME</th><th>QTY</th><th>RATE</th><th>AMT</th></tr>${cur.map(i=>`<tr><td>${i.code}</td><td>${i.name}</td><td>${i.qty}</td><td>${i.rate}</td><td>${i.amt.toFixed(2)}</td></tr>`).join('')}</table>`:'<p style="color:#94a3b8">Koi item nahi</p>';let tot=cur.reduce((a,b)=>a+b.amt,0);document.getElementById('bn').innerText=tot.toFixed(2)}
function addB(){let it=DB.items[curIdx];if(!it)return alert('Pehle medicine select karein');let q=+document.getElementById('bQ').value||1,r=+document.getElementById('bR').value||it.rate,d=+document.getElementById('bD').value||0;cur.push({code:it.code,name:it.name,qty:q,rate:r,amt:q*r*(1-d/100)});if(it.stock!==undefined)it.stock=Math.max(0,(it.stock||0)-q);renderBill()}
function saveB(){if(!cur.length)return alert('Item add karein');let tot=cur.reduce((a,b)=>a+b.amt,0);let no='048'+String(DB.sales.length+1).padStart(3,'0');DB.sales.push({no,date:document.getElementById('bDt').value,cust:document.getElementById('bCust').value,items:cur,net:Math.round(tot)});sv();if(accessToken)autoBackup();alert('Bill Saved: '+no);doPrint('invoice');cur=[];renderBill()}
function addParty(){let n=document.getElementById('cName').value.trim();if(!n)return alert('Name likhein');DB.parties.push({type:document.getElementById('cType').value,name:n,phone:document.getElementById('cPhone').value,bal:+document.getElementById('cBal').value||0});document.getElementById('cName').value='';sv()}
function addMed(){let n=document.getElementById('nName').value.trim();if(!n)return alert('Name likhein');DB.items.push({code:document.getElementById('nCode').value||'IT'+(DB.items.length+1),name:n.toUpperCase(),comp:document.getElementById('nComp').value,pack:document.getElementById('nPack').value,rate:+document.getElementById('nRate').value||0,stock:50});sv();alert('Added')}
function addPurchase(){let n=document.getElementById('pName').value.trim();if(!n)return alert('Name likhein');let ex=DB.items.find(x=>x.name.toUpperCase()===n.toUpperCase());let q=+document.getElementById('pQty').value||0;if(ex){ex.stock=(ex.stock||0)+q;ex.rate=+document.getElementById('pTrade').value||ex.rate}else DB.items.push({code:'P'+(DB.items.length+1),name:n.toUpperCase(),comp:document.getElementById('pComp').value,pack:'',rate:+document.getElementById('pTrade').value||0,stock:q});DB.purchases.push({name:n,qty:q,date:document.getElementById('pDt').value});sv();alert('Purchase Added')}
function renderStock(){let q=(document.getElementById('stSearch').value||'').toUpperCase();let cf=document.getElementById('stComp').value;let list=DB.items.filter(x=>(!q||x.name.includes(q)||String(x.code).includes(q))&&(!cf||x.comp===cf));document.getElementById('stockList').innerHTML=`<table><tr><th>CODE</th><th>NAME</th><th>COMPANY</th><th>TRADE</th><th>STOCK</th></tr>${list.slice(0,200).map(i=>`<tr><td>${i.code}</td><td>${i.name}</td><td>${i.comp}</td><td>${i.rate}</td><td>${i.stock||0}</td></tr>`).join('')}</table>`}
function rep(){let d=document.getElementById('rDt').value;let s=DB.sales.filter(x=>x.date===d);let st=s.reduce((a,b)=>a+b.net,0);document.getElementById('rOut').innerHTML=`<p>Date: ${d} | Bills: ${s.length} | Total: Rs ${st}</p>${s.map(x=>`<div>${x.no} - ${x.cust} - Rs ${x.net}</div>`).join('')}`}
function doPrint(type){let billNo=document.getElementById('prBill').value.trim();let sale=billNo?DB.sales.find(s=>s.no===billNo):DB.sales[DB.sales.length-1];if(!sale&&type!=='offer')sale={no:'048001',date:td(),cust:'Walk-in',items:cur.length?cur:[{name:'PANADOL TAB',qty:1,rate:740,amt:740}],net:740};let pa=document.getElementById('printArea');pa.style.display='block';let rows=sale?sale.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.rate}</td><td>${i.amt}</td></tr>`).join(''):'';if(type==='invoice')pa.innerHTML=`<h2 style="text-align:center">FRIENDS MEDICOSE<br>SALES INVOICE</h2><p>Bill: ${sale.no} | Date: ${sale.date} | ${sale.cust}</p><table border=1 style="width:100%;border-collapse:collapse"><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${rows}</table><h3>Net: Rs ${sale.net}</h3>`;if(type==='offer')pa.innerHTML=`<h1>FRIENDS MEDICOSE - RATE LIST</h1><table border=1 style="width:100%">${DB.items.map(i=>`<tr><td>${i.code}</td><td>${i.name}</td><td>${i.comp}</td><td>${i.rate}</td></tr>`).join('')}</table>`;setTimeout(()=>window.print(),300)}
function refresh(){document.getElementById('sItems').innerText=DB.items.length;document.getElementById('bNo').value='048'+String(DB.sales.length+1).padStart(3,'0');document.getElementById('bCust').innerHTML=DB.parties.map(p=>`<option>${p.name}</option>`).join('');document.getElementById('pSupp').innerHTML=DB.parties.filter(p=>p.type==='Supplier').map(p=>`<option>${p.name}</option>`).join('')||'<option>Default Supplier</option>';document.getElementById('stComp').innerHTML='<option value="">All</option>'+[...new Set(DB.items.map(x=>x.comp))].filter(Boolean).map(c=>`<option>${c}</option>`).join('');let today=td();let ts=DB.sales.filter(s=>s.date===today).reduce((a,b)=>a+b.net,0);document.getElementById('sSale').innerText='Rs '+ts;document.getElementById('sBills').innerText=DB.sales.length;let low=DB.items.filter(i=>(i.stock||0)<25);document.getElementById('sLow').innerText=low.length;document.getElementById('alerts').innerHTML=low.length?low.slice(0,10).map(i=>`<div>⚠ ${i.name} - Stock ${i.stock}</div>`).join(''):'<p style="color:#22c55e">✅ Stock theek hai</p>';document.getElementById('recent').innerHTML=DB.sales.length?DB.sales.slice(-5).reverse().map(s=>`<div>${s.no} - ${s.cust} - Rs ${s.net}</div>`).join(''):'<p>No sale yet</p>';document.getElementById('cList').innerHTML=DB.parties.map(p=>`<div>${p.type} - ${p.name} - Bal ${p.bal}</div>`).join('');document.getElementById('pList').innerHTML=DB.purchases.length?DB.purchases.slice(-5).map(p=>`<div>${p.date} - ${p.name} x${p.qty}</div>`).join(''):'';renderBill();renderStock()}
initGIS();refresh();fillItem(0);rep();
</script></body></html>
